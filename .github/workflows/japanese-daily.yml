name: Daily Japanese + Publish Site

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Pacific/Auckland
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional Auckland date (YYYY-MM-DD) to backfill'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/japanese-daily.yml'
      - 'projects/agent-squad-python/japanese_daily.py'

# Serialize with the main daily job so both preserve the other's archive updates.
concurrency:
  group: daily-site-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  japanese:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Japanese lesson pipeline
        run: python -m unittest discover -s projects/agent-squad-python/tests -p 'test_japanese_daily.py' -v
      - name: Generate reviewed lesson and two audio recordings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JAPANESE_MODEL: ${{ vars.JAPANESE_MODEL || 'gemini-3.8-flash' }}
          JAPANESE_TTS_MODEL: ${{ vars.JAPANESE_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python projects/agent-squad-python/japanese_daily.py
      - name: Publish to GitHub Pages source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          git diff --cached --quiet || git commit -m '🇯🇵 Publish daily Japanese sentence and audio'
          git push
