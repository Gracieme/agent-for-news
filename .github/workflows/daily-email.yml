# 每日定时发邮件 + 更新格雷西学习小屋网站
# 奥克兰当地时间每天早 8:00 自动运行，自动适应新西兰夏令时
name: Daily Email + Update Site

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: Pacific/Auckland
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional override date in YYYY-MM-DD for backfill runs'
        required: false
        type: string

permissions:
  contents: write            # 允许 workflow 把生成的网站文件 commit 回仓库

jobs:
  send-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: projects/agent-squad-python

      - name: Send daily email & build site
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.TO_EMAIL }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          APP_TIMEZONE:      Pacific/Auckland
          TARGET_DATE:       ${{ inputs.target_date }}
        run: python daily_email.py
        working-directory: projects/agent-squad-python

      - name: Commit updated website files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if [ -f projects/agent-squad-python/seen_news.json ]; then
            git add projects/agent-squad-python/seen_news.json
          fi
          if [ -f projects/agent-squad-python/seen_papers.json ]; then
            git add projects/agent-squad-python/seen_papers.json
          fi
          git diff --cached --quiet || git commit -m "🏡 Daily update: $(date -u +'%Y-%m-%d')"
          git push
